<style>
:root{--bg:#0A0A0A;--ink:rgba(240,244,252,.94);--ink2:rgba(220,228,245,.64);--ink3:rgba(220,228,245,.46);--line:rgba(220,228,245,.14);--panel:rgba(16,24,40,.62);--blue:#006EFF;--accent:#6982FF;--bear:#FB2C36;--mono:'JetBrains Mono',monospace;--head:'Clash Grotesk','Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{word-break:keep-all;overflow-wrap:break-word}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,button,summary{word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:440px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:.5px solid var(--line);border-radius:16px;padding:20px}
.bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--blue);z-index:60;transition:width .12s linear}
.top{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px;padding:0 16px;border-bottom:.5px solid transparent;transition:border-color .2s}
.top.stuck{border-bottom-color:var(--line)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 10px}
.logo{width:104px;height:auto}
.lang{display:flex;border:.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ink3);font:500 12px 'Inter',sans-serif;padding:6px 13px;cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
h1{font-family:var(--head);font-size:27px;line-height:1.3;font-weight:500;letter-spacing:-.01em;text-wrap:pretty;text-wrap:balance;text-wrap:pretty}
h2{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;text-wrap:pretty}
h3{font-size:14px;font-weight:600;text-wrap:pretty}
.pitch{font-size:15.5px;color:var(--ink)}
.body2{font-size:14px;color:var(--ink2);margin-top:8px}
details{margin-top:14px;border-top:.5px solid var(--line);padding-top:12px}
summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:15px}
details[open] summary::after{content:"-"}
details p{font-size:14px;color:var(--ink2);margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:rgba(225,243,254,.04);border:.5px solid var(--line);border-radius:10px;padding:13px}
.cell h3{margin-bottom:5px}
.cell p{font-size:12.5px;color:var(--ink2);line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:rgba(225,243,254,.04);border:.5px solid var(--line);border-radius:10px;padding:13px 10px;text-align:center}
.stat b{display:block;font:500 19px var(--mono);color:var(--accent);letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--ink3);line-height:1.35;display:block;margin-top:4px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.vs .col{border:.5px solid var(--line);border-radius:10px;padding:13px;background:rgba(225,243,254,.03)}
.vs .col.sw{border-color:rgba(105,130,255,.45);background:rgba(105,130,255,.06)}
.vs h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.vs .col.sw h3{color:var(--accent)}
.vs ul{list-style:none}
.vs li{font-size:12.5px;color:var(--ink2);padding:5px 0;border-top:.5px solid rgba(225,242,254,.08)}
.vs li:first-child{border-top:0;padding-top:0}
.example{font-size:12.5px;color:var(--ink3);border:.5px dashed var(--line);border-radius:10px;padding:11px 13px}
.example .n{font-family:var(--mono);color:var(--pos);font-size:12px}
.role-fr{font-size:14px;color:var(--ink2);margin-bottom:12px}
.role{list-style:none;counter-reset:r}
.role li{display:flex;gap:12px;padding:11px 0;border-top:.5px solid rgba(225,242,254,.08);font-size:13.5px;color:var(--ink2)}
.role li::before{counter-increment:r;content:"0" counter(r);font:500 12px var(--mono);color:var(--accent);padding-top:2px}
.close-line{margin-top:12px;font-size:13.5px;color:var(--ink);font-weight:500;text-wrap:pretty}
.links{padding:6px 20px}
.links a{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:.5px solid rgba(225,242,254,.08);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.links a:first-child{border-top:0}
.links a .arr{color:var(--accent)}
footer{padding:4px 8px;font-size:11px;color:var(--ink3);line-height:1.55;text-align:center}
footer .hh{margin-top:8px;color:var(--ink2)}
.tabs{display:flex;gap:4px;background:rgba(225,243,254,.04);border:.5px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;color:var(--ink3);font:500 13px 'Inter',sans-serif;padding:9px 6px;border-radius:9px;cursor:pointer;letter-spacing:-.01em;transition:background .18s,color .18s}
.tabs button.on{background:var(--blue);color:#fff}
.lockrow{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.lockrow .lk{width:14px;height:14px}
.view{display:flex;flex-direction:column;gap:14px}
.view.hide{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:12px;font-weight:500;color:var(--ink3);text-decoration:none;border:.5px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap;transition:color .18s,border-color .18s}
.chips a:hover,.chips a:focus-visible{color:var(--accent);border-color:rgba(105,130,255,.45)}
.loop{display:flex;flex-direction:column;gap:0;margin-top:16px}
.loop .step{display:flex;gap:11px;align-items:flex-start}
.loop .n{flex:none;width:22px;height:22px;border-radius:50%;border:.5px solid rgba(105,130,255,.45);color:var(--accent);font:500 11px var(--mono);display:flex;align-items:center;justify-content:center;margin-top:1px}
.loop .t{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.loop .d{display:block;font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:2px}
.loop .link{width:.5px;height:14px;background:linear-gradient(180deg,rgba(105,130,255,.5),rgba(105,130,255,.12));margin:3px 0 3px 11px}
.cta{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:14px;border-radius:11px;padding:13px;transition:filter .18s}
.cta:hover{filter:brightness(1.07)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.lgrid a{display:flex;justify-content:space-between;align-items:center;gap:6px;border:.5px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;transition:border-color .18s,background .18s}
.lgrid a:hover,.lgrid a:focus-visible{border-color:rgba(105,130,255,.45);background:rgba(105,130,255,.05)}
.lgrid .arr{color:var(--accent);font-size:12px}
.lcap{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.top-btn{position:fixed;right:14px;bottom:14px;z-index:55;width:40px;height:40px;border-radius:50%;border:.5px solid var(--line);background:rgba(10,10,10,.88);backdrop-filter:blur(10px);color:var(--accent);font-size:15px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.top-btn.show{opacity:1;pointer-events:auto}
/* Lightbox. The image renders at NATURAL size inside a scrollable frame, not
   scaled to the viewport: a 900px app screenshot squeezed into 375px is exactly
   the problem this is here to solve. Drag or pinch to read it. */
.box{position:fixed;inset:0;z-index:70;background:#080808;display:none;flex-direction:column;justify-content:center;gap:12px;padding:52px 12px 16px}
.box.on{display:flex}
.box .inner{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch;border:.5px solid var(--line);border-radius:8px;background:#000}
.box img{display:block;width:auto;max-width:none;height:auto}
.box .x{position:absolute;top:10px;right:12px;color:var(--ink);font-size:26px;background:none;border:0;cursor:pointer;line-height:1;padding:4px 8px}
.box .hint{position:absolute;top:18px;left:16px;font-size:11px;color:var(--ink3)}
.box .cap{font-size:12px;color:var(--ink2);line-height:1.55;flex:none;overflow-y:auto;max-height:22vh}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.gate{border:.5px dashed rgba(105,130,255,.4);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.gate b{color:var(--accent);font-weight:600}
.fig{margin-top:12px}
.fig button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.fig img{display:block;width:100%;height:auto;border:.5px solid var(--line);border-radius:10px;background:#000;transition:border-color .18s}
.fig button:hover img,.fig button:focus-visible img{border-color:rgba(105,130,255,.45)}
.zoom{font-size:11px;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:5px}
.zoom span{color:var(--accent)}
.figcap{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:7px}
.figcap b{color:var(--ink2);font-weight:600}
.take{border:.5px solid rgba(105,130,255,.4);background:rgba(105,130,255,.06);border-radius:12px;padding:14px;margin-top:12px}
.take h3{color:var(--accent);font-size:12.5px;margin-bottom:6px}
.take p{font-size:13.5px;color:var(--ink2)}
.kv{display:flex;gap:10px;padding:9px 0;border-top:.5px solid rgba(225,242,254,.08);font-size:13px}
.kv:first-child{border-top:0;padding-top:0}
.kv .k{flex:none;width:104px;color:var(--ink3);font-weight:500}
.kv .v{color:var(--ink2)}
.pts{list-style:none}
.pts li{padding:9px 0;border-top:.5px solid rgba(225,242,254,.08);font-size:13.5px;color:var(--ink2)}
.pts li:first-child{border-top:0;padding-top:2px}
.pts b{color:var(--ink);font-weight:600}
.pull{border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);padding:12px 0;margin-top:14px;font-size:14.5px;font-weight:500;color:var(--accent);line-height:1.5}
@media(max-width:360px){.grid2,.vs{grid-template-columns:1fr}.kv{display:block}.kv .k{width:auto;margin-bottom:2px}}


/* ============================================================
   DESKTOP LAYER - added 2026-08-27.
   Additive only. Every rule below is inside a min-width media
   query, so the render under 900px is unchanged from v14.
   Mobile structure, section order and copy are untouched.
   ============================================================ */
@media(min-width:900px){

  /* --- shell ------------------------------------------------ */
  body{font-size:15.5px}
  .wrap{max-width:1180px;padding:0 40px 72px;gap:18px}
  .top{margin:0 -40px;padding:0 40px}
  header{padding:20px 4px 12px}
  .logo{width:118px}
  .tabs{max-width:440px;margin-left:auto;margin-right:auto;margin-bottom:18px}

  /* --- About: locked section order kept, just given a real
         reading measure instead of a 440px phone column ------ */
  #v-about{max-width:680px;width:100%;margin:0 auto;gap:18px}
  #v-about h1{font-size:34px;line-height:1.28}
  .panel{padding:26px}
  .links{padding:8px 26px}
  .grid2,.vs,.lgrid{gap:12px}
  .cell{padding:16px}
  .cell p{font-size:13px}
  .stat b{font-size:22px}
  .stat span{font-size:11.5px}
  .example{padding:14px 16px}

  /* --- Guide: the horizontal chip rail becomes a sticky
         table of contents down the left ---------------------- */
  #v-guide:not(.hide){
    display:grid;
    grid-template-columns:236px minmax(0,1fr);
    column-gap:40px;
    row-gap:18px;
    align-items:start;
  }
  #v-guide>h1,#v-guide>.gate{grid-column:1/-1}
  #v-guide>h1{font-size:34px;line-height:1.28}
  #v-guide>.gate{padding:14px 18px;font-size:13px}
  #v-guide>.panel{grid-column:2;min-width:0}

  #v-guide>.chips{
    grid-column:1;
    grid-row:3/span 99;
    align-self:start;
    position:sticky;
    top:116px;
    display:flex;
    flex-direction:column;
    gap:1px;
    margin:0;
    padding:0;
    overflow:visible;
    max-height:calc(100vh - 148px);
    overflow-y:auto;
  }
  #v-guide>.chips a{
    flex:none;
    border:0;
    border-left:1.5px solid var(--line);
    border-radius:0;
    padding:8px 14px;
    white-space:normal;
    text-align:left;
    font-size:12.5px;
    line-height:1.4;
    transition:color .18s,border-color .18s,background .18s;
  }
  #v-guide>.chips a:hover,#v-guide>.chips a:focus-visible{
    border-left-color:rgba(105,130,255,.45);
    background:rgba(105,130,255,.05);
  }
  #v-guide>.chips a.cur{
    color:var(--accent);
    border-left-color:var(--accent);
    background:rgba(105,130,255,.08);
  }

  /* --- screenshots at native width instead of half size ----- */
  .fig img{max-width:900px}
  .fig button{width:auto;max-width:100%}
  .kv .k{width:150px}

  /* --- chrome ----------------------------------------------- */
  .box{padding:60px 24px 20px}
  .box .inner{max-height:82vh}
  .top-btn{right:24px;bottom:24px;width:44px;height:44px;font-size:16px}
}

@media(min-width:1400px){
  .wrap{max-width:1280px}
  #v-guide:not(.hide){grid-template-columns:256px minmax(0,1fr)}
}



/* ---- Sway additions ---- */
h3,.loop .t,.cell h3{font-family:var(--head);letter-spacing:.005em}
.stat b{font-size:17px}
.fig{margin:14px 0 10px}
.row{display:grid;gap:8px}
.row.r1{grid-template-columns:minmax(0,1fr);max-width:220px}
.row.r2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:300px}
.row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.shot button{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto;border:.5px solid var(--line);border-radius:10px;background:#000;transition:border-color .18s}
.shot button:hover img,.shot button:focus-visible img{border-color:rgba(105,130,255,.55)}
.shot.wide img{border-radius:8px}
.scap{display:block;font-size:11px;color:var(--ink3);line-height:1.4;margin-top:6px;text-wrap:pretty}
.lcap.sub{margin-top:16px;margin-bottom:2px;color:var(--accent)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.side{border:.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.side .tag{align-self:flex-start;font:600 11px 'Inter',sans-serif;color:#fff;border-radius:999px;padding:4px 9px}
.side.bull .tag{background:var(--blue)}
.side.bear .tag{background:var(--bear)}
.side .t{font-family:var(--head);font-size:14px;font-weight:600;color:var(--ink);margin-top:4px}
.side .d{font-size:12.5px;color:var(--ink2);line-height:1.45}
.ghost{margin-top:14px;width:100%;background:none;border:.5px solid rgba(105,130,255,.5);color:var(--accent);border-radius:11px;padding:12px;font:600 13.5px 'Inter',sans-serif;cursor:pointer;transition:background .18s}
.ghost:hover,.ghost:focus-visible{background:rgba(105,130,255,.08)}
.example b{color:var(--ink2);font-weight:600}
@media(min-width:900px){
  .row.r1{max-width:280px}
  .row.r2{max-width:420px}
  .row.r3{max-width:640px}
  .shot.wide{max-width:760px}
}

.hero::after{content:"";position:absolute;top:-60%;left:30%;width:420px;height:300px;background:radial-gradient(circle,var(--blue),transparent 70%);opacity:.14;filter:blur(36px);pointer-events:none;z-index:0}

/* make the expander obvious: accent pill, glow pulse while closed */
summary{display:inline-flex;padding:9px 15px;border-radius:999px;background:rgba(105,130,255,.12);border:1px solid rgba(105,130,255,.45)}

details:not([open]) summary{animation:moreGlow 2.2s ease-in-out infinite}

details[open] p{animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* interactive contrast toggle */
.seg{display:inline-flex;border:.5px solid var(--line);border-radius:999px;overflow:hidden;margin:2px 0 12px}
.seg button{background:none;border:0;color:var(--ink3);font:600 12px 'Inter',sans-serif;padding:8px 16px;cursor:pointer;transition:background .18s,color .18s}

.vs .col{transition:border-color .18s,background .18s,opacity .18s}
.vs.side-old .col.sw{opacity:.55}
.vs.side-old .col:not(.sw){border-color:rgba(220,228,245,.32);background:rgba(220,228,245,.06)}
.vs.side-old .col:not(.sw) li{color:var(--ink)}
.vs.side-new .col:not(.sw){opacity:.7}
@media(prefers-reduced-motion:reduce){details:not([open]) summary,details[open] p{animation:none}}

<div class="view" id="v-about"><div class="hero"><h1 data-en="Sway turns a headline into a position, in one tap, from a wallet you&amp;nbsp;control." data-ko="헤드라인을 포지션으로, 탭 한&amp;nbsp;번에, 내가 통제하는 지갑에서."></h1></div><section class="panel"><h2 data-en="What Sway is" data-ko="Sway 소개"></h2><p class="pitch" data-en="Sway is a mobile app that turns breaking news into positions. It reads real-time signals from news sources and social platforms, packages them into structured narratives, and lets you go long or short on the assets behind each one in a single&amp;nbsp;tap." data-ko="Sway는 속보를 포지션으로 바꿔 주는 모바일 앱입니다. 뉴스와 소셜 플랫폼의 실시간 시그널을 읽어 구조화된 내러티브로 정리하고, 각 내러티브 뒤에 있는 자산을 탭 한&amp;nbsp;번으로 롱 또는 숏할 수 있습니다."></p><p class="body2" data-en="Live on iOS and Android. Built by Cerebro, a Singapore-based&amp;nbsp;team." data-ko="iOS와 Android에서 이용할 수 있습니다. 싱가포르 기반 팀 Cerebro가 만들었습니다."></p><div class="loop"><div class="step"><span class="n">01</span><span><span class="t" data-en="A headline breaks" data-ko="속보가 뜹니다"></span><span class="d" data-en="News and social signals become a structured narrative, with its asset attached." data-ko="뉴스와 소셜 시그널이 자산이 연결된 구조화된 내러티브로 정리됩니다."></span></span></div><div class="link"></div><div class="step"><span class="n">02</span><span><span class="t" data-en="Pick a side" data-ko="방향을 고릅니다"></span><span class="d" data-en="Sway Bullish opens a long on the narrative&#x27;s asset. Sway Bearish opens a short." data-ko="Sway Bullish는 내러티브 자산의 롱, Sway Bearish는 숏 포지션을 엽니다."></span></span></div><div class="link"></div><div class="step"><span class="n">03</span><span><span class="t" data-en="Executed on Hyperliquid" data-ko="Hyperliquid에서 체결"></span><span class="d" data-en="The position routes to and settles on Hyperliquid&#x27;s HIP-3 markets, from your own wallet." data-ko="포지션은 내 지갑에서 Hyperliquid의 HIP-3 마켓으로 라우팅되어 정산됩니다."></span></span></div><div class="link"></div><div class="step"><span class="n">04</span><span><span class="t" data-en="Close when you choose" data-ko="원할 때 정리"></span><span class="d" data-en="Cash out at any time. Your result comes from how the asset&#x27;s price moved." data-ko="언제든 Cash out으로 정리할 수 있고, 결과는 자산 가격이 어떻게 움직였는지에 따라 정해집니다."></span></span></div></div><details><summary data-en="More detail" data-ko="자세히 보기"></summary><p data-en="A narrative is a market-facing idea: a macro trend, a short-term event, or a theme. On Sway a narrative is not a bet on whether something happens. It is a route into the underlying assets. Every position is a long or short on those assets, opened and closed whenever you choose, at market prices." data-ko="내러티브는 시장을 겨냥한 하나의 아이디어입니다. 거시 트렌드일 수도, 단기 이벤트나 테마일 수도 있습니다. Sway에서 내러티브는 어떤 일이 일어날지에 거는 베팅이 아니라, 그 뒤의 기초자산으로 들어가는 경로입니다. 모든 포지션은 해당 자산에 대한 롱 또는 숏이며, 원하는 시점에 시장가로 열고 닫을 수 있습니다."></p><p data-en="Execution runs on Hyperliquid. Positions route to and settle on Hyperliquid&#x27;s HIP-3 markets, and rewards and fee settlement happen onchain through smart contracts on Arbitrum." data-ko="체결은 Hyperliquid에서 이루어집니다. 포지션은 Hyperliquid의 HIP-3 마켓으로 라우팅되어 정산되고, 리워드와 수수료 정산은 Arbitrum 위 스마트 컨트랙트를 통해 온체인으로 처리됩니다."></p><p data-en="Sway is non-custodial. You either connect your own wallet or fund an embedded Privy wallet, and you stay in control of your funds throughout." data-ko="Sway는 논커스터디얼 구조입니다. 기존 지갑을 연결하거나 앱에 내장된 Privy 지갑에 자금을 넣으면 되고, 자금은 처음부터 끝까지 본인이 통제합니다."></p><p data-en="On Sway you can take positions on emerging narratives, discover ideas from others and see where conviction sits, and publish your own narrative, with context and reasoning, for others to discover and take positions on. Narratives surface through market activity, performance over time and social sharing, so the feed is shaped by what people actually trade." data-ko="Sway에서는 떠오르는 내러티브에 포지션을 잡고, 다른 사람들의 아이디어와 확신이 어디에 쏠려 있는지 확인하고, 맥락과 근거를 담은 내 내러티브를 올려 다른 사람들이 포지션을 잡게 할 수도 있습니다. 내러티브는 거래 활동, 시간에 따른 성과, 공유를 기준으로 노출되기 때문에 피드는 사람들이 실제로 거래하는 흐름을 그대로 반영합니다."></p><p data-en="Sway is built by Cerebro (cerebro.xyz), a Singapore-based team. Per Cerebro, its products have reached 80k+ total users with close to 10k DAUs, and the team has cumulatively raised about $3M pre-seed. There is currently no Sway token." data-ko="Sway는 싱가포르 기반 팀 Cerebro(cerebro.xyz)가 만들었습니다. Cerebro에 따르면 자사 제품의 누적 사용자는 80k+, DAU는 약 10k이며, 팀은 프리시드로 누적 약 $3M을 유치했습니다. 현재 Sway 토큰은 없습니다."></p><p data-en="Fees: Sway&#x27;s base builder fee is 0.05% taker and 0.015% maker. Tier discounts run from 10% at Explorer, where every account starts, to 24% at VIP (10M of volume and/or partners). The minimum withdrawal is $2.00 USDC, with a $1 flat fee." data-ko="수수료: Sway의 기본 빌더 수수료는 테이커 0.05%, 메이커 0.015%입니다. 티어 할인은 모든 계정이 시작하는 Explorer의 10%부터 VIP의 24%(거래량 10M 및/또는 파트너)까지 적용됩니다. 최소 출금액은 $2.00 USDC이며, 출금 수수료는 $1 고정입니다."></p><p data-en="Security: CD Security reviewed the app, smart contracts included, in May 2026. The report is public, and all findings were resolved or formally acknowledged." data-ko="보안: CD Security가 2026년 5월 스마트 컨트랙트를 포함한 앱 전반을 검토했습니다. 보고서는 공개되어 있으며, 지적된 사항은 모두 해결되었거나 공식적으로 확인 처리되었습니다."></p></details></section><section class="panel"><h2 data-en="Why it matters" data-ko="왜 중요한가"></h2><div class="grid2"><div class="cell"><h3 data-en="Headline to position" data-ko="헤드라인에서 포지션까지"></h3><p data-en="News becomes a narrative with a long or short attached, so reading a story and acting on it happen on one screen." data-ko="뉴스가 롱·숏이 붙은 내러티브로 바뀌어, 기사를 읽는 것과 행동하는 것이 한 화면에서 이어집니다."></p></div><div class="cell"><h3 data-en="Not a wager" data-ko="베팅이 아닌 포지션"></h3><p data-en="Every narrative opens a long or short on real assets, closed when you choose. Profit and loss come from price." data-ko="모든 내러티브는 실제 자산의 롱·숏을 열고, 원할 때 닫습니다. 손익은 가격에서 나옵니다."></p></div><div class="cell"><h3 data-en="You hold the keys" data-ko="키는 내 손에"></h3><p data-en="Non-custodial by design: your own wallet or an embedded Privy wallet. Your funds stay under your control." data-ko="설계부터 논커스터디얼입니다. 내 지갑이나 내장 Privy 지갑을 쓰고, 자금은 항상 내가 통제합니다."></p></div><div class="cell"><h3 data-en="Independently reviewed" data-ko="외부 보안 검토 완료"></h3><p data-en="CD Security reviewed the app and its smart contracts in May 2026. The report is public." data-ko="CD Security가 2026년 5월 앱과 스마트 컨트랙트를 검토했고, 보고서는 공개되어 있습니다."></p></div></div></section><section class="panel"><h2 data-en="By the numbers" data-ko="숫자로 보는 Sway"></h2><div class="stats"><div class="stat"><b>0.045%</b><span data-en="Sway fee, market order, Explorer tier" data-ko="Sway 수수료, 시장가 주문, Explorer 티어"></span></div><div class="stat"><b>0.0135%</b><span data-en="Sway fee, limit order, Explorer tier" data-ko="Sway 수수료, 지정가 주문, Explorer 티어"></span></div><div class="stat"><b>$1</b><span data-en="flat withdrawal fee" data-ko="출금 수수료 (고정)"></span></div></div><p class="figcap" data-en="Every account starts on the Explorer tier. Fee rates are live and can change; check sway.fun/docs before quoting a number." data-ko="모든 계정은 Explorer 티어에서 시작합니다. 수수료율은 변동될 수 있으니, 숫자를 인용하기 전에 sway.fun/docs를 확인해 주세요."></p></section><section class="panel"><h2 data-en="The old way vs Sway" data-ko="기존 방식 vs Sway"></h2><div class="seg" role="group"><button type="button" id="segOld" onclick="setSide('old')" data-en="The old way" data-ko="기존 방식"></button><button type="button" id="segNew" class="on" onclick="setSide('new')" data-en="With Sway" data-ko="Sway에서는"></button></div><div class="vs side-new" id="vs"><div class="col"><h3 data-en="The old way" data-ko="기존 방식"></h3><ul><li data-en="The headline lands on X or Telegram" data-ko="헤드라인은 X나 Telegram에서 접합니다"></li><li data-en="Find the asset and the venue yourself" data-ko="관련 자산과 거래소를 직접 찾아야 합니다"></li><li data-en="Move funds, size it, place the order" data-ko="자금 이동, 사이즈 계산, 주문까지 따로 합니다"></li><li data-en="By then the narrative has often already played out" data-ko="그사이 내러티브는 이미 끝나 있는 경우가 많습니다"></li></ul></div><div class="col sw"><h3 data-en="With Sway" data-ko="Sway에서는"></h3><ul><li data-en="The headline arrives as a narrative, asset attached" data-ko="헤드라인이 자산이 연결된 내러티브로 도착합니다"></li><li data-en="One tap: Sway Bullish or Sway Bearish" data-ko="탭 한&amp;nbsp;번: Sway Bullish 또는 Sway Bearish"></li><li data-en="Executed on Hyperliquid, from your own wallet" data-ko="내 지갑에서 Hyperliquid로 바로 체결됩니다"></li><li data-en="Fee and net payout shown before you confirm" data-ko="확정 전에 수수료와 예상 수령액이 표시됩니다"></li></ul></div></div><div class="example" data-en="&lt;b&gt;How a position makes or loses money.&lt;/b&gt; Go long and you profit if the asset rises; go short and you profit if it falls. If it moves the other way, you lose, and fees come off either way." data-ko="&lt;b&gt;포지션의 손익 구조.&lt;/b&gt; 롱이면 자산 가격이 오를 때, 숏이면 내릴 때 수익이 납니다. 반대로 움직이면 손실이 나고, 수수료는 어느 쪽이든 차감됩니다."></div></section><section class="panel"><h2 data-en="Your role as an onboarded creator" data-ko="온보딩 크리에이터로서의 역할"></h2><p class="role-fr" data-en="You are one of a small, hand-picked group of Korean creators and analysts testing Sway early and shaping how it lands in&amp;nbsp;Korea." data-ko="크리에이터님은 Sway를 먼저 써보고 한국 시장에 어떻게 자리 잡을지 함께 만들어 갈, 소수로 선별된 한국 크리에이터·애널리스트 중 한 분입니다."></p><ul class="role"><li data-en="Start with a one-on-one onboarding. Holo Hive walks you through the app and answers your questions before you trade." data-ko="1:1 온보딩부터 시작해 주세요. 거래 전에 Holo Hive가 앱 사용법을 함께 짚어 드리고 궁금한 점에 답해 드립니다."></li><li data-en="Use the app for real. Open, follow and close positions, work through the narrative feed, and publish a narrative if you have a view." data-ko="앱을 실제로 사용해 주세요. 포지션을 열고 지켜보고 닫아 보시고, 내러티브 피드도 둘러보시고, 생각이 있으시면 직접 내러티브를 올려 주셔도 좋습니다."></li><li data-en="Give honest feedback. Short surveys, calls and targeted questions: what confuses, what works, and what would make a Korean trader come back. Candid beats polite." data-ko="솔직한 피드백을 부탁드립니다. 짧은 설문, 통화, 질문을 통해 헷갈리는 점, 잘 되는 점, 한국 트레이더가 다시 돌아오게 만들 요소를 알려주세요. 예의보다 솔직함이 중요합니다."></li><li data-en="Posting is optional. If you choose to post on Telegram or X, it is your own read, in Korean, in your own voice. A rewritten announcement is not what anyone wants." data-ko="게시는 선택 사항입니다. Telegram이나 X에 올리신다면 크리에이터님의 시각으로, 한국어로, 평소 말투 그대로 써 주세요. 공지를 다시 옮긴 글은 아무도 원하지 않습니다."></li><li data-en="The Sway team approves every creator before onboarding." data-ko="모든 크리에이터는 온보딩 전에 Sway 팀의 승인을 거칩니다."></li><li data-en="Hold the guardrails you get at onboarding, in particular on prediction-market framing and referral codes." data-ko="온보딩 때 안내드리는 가이드라인, 특히 예측시장 프레이밍과 레퍼럴 코드 관련 내용은 꼭 지켜 주세요."></li></ul><p class="close-line" data-en="Briefs will give you the angles and the facts. How you bring them to life is up to&amp;nbsp;you." data-ko="브리프에서는 앵글과 팩트를 드립니다. 그걸 어떻게 풀어내실지는 크리에이터님의 몫입니다."></p><button type="button" class="ghost" onclick="setTab('guide')" data-en="Open the product guide &amp;#8594;" data-ko="제품 가이드 열기 &amp;#8594;"></button></section><section class="panel"><h2 data-en="Where to look next" data-ko="더 알아보기"></h2><div class="lcap" data-en="Get the app" data-ko="앱 받기"></div><div class="lgrid"><a href="https://apps.apple.com/us/app/sway-narrative-markets/id6767172902" target="_blank" rel="noopener"><span data-en="App Store" data-ko="App Store"></span><span class="arr">&#8599;</span></a><a href="https://play.google.com/store/apps/details?id=fun.sway.mobile" target="_blank" rel="noopener"><span data-en="Google Play" data-ko="Google Play"></span><span class="arr">&#8599;</span></a></div><div class="lcap" data-en="Product" data-ko="제품"></div><div class="lgrid"><a href="https://sway.fun" target="_blank" rel="noopener"><span data-en="Website" data-ko="웹사이트"></span><span class="arr">&#8599;</span></a><a href="https://sway.fun/docs" target="_blank" rel="noopener"><span data-en="Docs" data-ko="문서"></span><span class="arr">&#8599;</span></a><a href="https://sway.fun/support" target="_blank" rel="noopener"><span data-en="Support" data-ko="고객지원"></span><span class="arr">&#8599;</span></a><a href="https://github.com/CDSecurity/audits/blob/main/audit%20reports/Sway_Report.pdf" target="_blank" rel="noopener"><span data-en="Security review" data-ko="보안 검토 보고서"></span><span class="arr">&#8599;</span></a></div><div class="lcap" data-en="Social" data-ko="소셜"></div><div class="lgrid"><a href="https://x.com/swaydotfun" target="_blank" rel="noopener"><span data-en="X" data-ko="X"></span><span class="arr">&#8599;</span></a><a href="https://t.me/sway_announcements" target="_blank" rel="noopener"><span data-en="Telegram" data-ko="Telegram"></span><span class="arr">&#8599;</span></a><a href="https://discord.com/invite/cerebro-hq" target="_blank" rel="noopener"><span data-en="Discord" data-ko="Discord"></span><span class="arr">&#8599;</span></a></div></section></div>
<div class="view hide" id="v-guide"><h1 data-en="Everything Sway can do, and how to get at&amp;nbsp;it." data-ko="Sway로 할 수 있는 모든 것, 그리고 그 방법."></h1><div class="gate" data-en="&lt;b&gt;For the onboarded creator cohort.&lt;/b&gt; The tab beside this one tells you what Sway is. This one shows you what to do with it, screen by screen, from the live app on November 16th, 2026, with personal details blurred. Tap any screenshot to enlarge it." data-ko="&lt;b&gt;온보딩된 크리에이터 코호트용입니다.&lt;/b&gt; 옆 탭이 Sway가 무엇인지 설명한다면, 이 탭은 실제 사용법을 화면 단위로 보여드립니다. 2026년 11월 16일 라이브 앱 기준이며 개인 정보는 블러 처리했습니다. 스크린샷을 누르시면 크게 볼 수 있습니다."></div><div class="chips" role="navigation"><a href="#g0" data-en="Before you start" data-ko="시작 전에"></a><a href="#g1" data-en="First ten minutes" data-ko="처음 10분"></a><a href="#g2" data-en="How a narrative works" data-ko="내러티브의 구조"></a><a href="#g3" data-en="Fund the account" data-ko="입금"></a><a href="#g4" data-en="Your own wallet" data-ko="외부 지갑"></a><a href="#g5" data-en="Place a trade" data-ko="거래하기"></a><a href="#g6" data-en="Close a trade" data-ko="포지션 정리"></a><a href="#g7" data-en="Create a narrative" data-ko="내러티브 만들기"></a><a href="#g8" data-en="Fees" data-ko="수수료"></a><a href="#g9" data-en="Withdraw" data-ko="출금"></a><a href="#g10" data-en="Troubleshooting" data-ko="문제 해결"></a><a href="#g11" data-en="Feedback" data-ko="피드백"></a><a href="#g12" data-en="Rules" data-ko="규칙"></a></div><section class="panel" id="g0"><h2 data-en="Before you start" data-ko="시작 전에"></h2><div class="kv"><span class="k" data-en="Where you trade" data-ko="거래하는 곳"></span><span class="v" data-en="The Sway: Narrative Markets app on iOS or Android. sway.fun on desktop is for connecting an existing wallet and for the docs, not for trading." data-ko="iOS·Android의 Sway: Narrative Markets 앱입니다. 데스크톱의 sway.fun은 기존 지갑 연결과 문서 확인용이며, 거래는 앱에서 합니다."></span></div><div class="kv"><span class="k" data-en="Sign in" data-ko="로그인"></span><span class="v" data-en="Email and a 6-digit code. Connecting X is optional; it lets you claim your X username and find friends." data-ko="이메일과 6자리 인증 코드로 가입합니다. X 연결은 선택이며, 연결하면 X 사용자명을 그대로 쓰고 친구를 찾을 수 있습니다."></span></div><div class="kv"><span class="k" data-en="Your wallet" data-ko="지갑"></span><span class="v" data-en="A non-custodial Privy wallet is created for you automatically, and its private key can be exported. You can bring your own wallet instead." data-ko="논커스터디얼 Privy 지갑이 자동으로 생성되고, 프라이빗 키를 내보낼 수 있습니다. 기존 지갑을 대신 써도 됩니다."></span></div><div class="kv"><span class="k" data-en="Settles on" data-ko="정산"></span><span class="v" data-en="Hyperliquid. Every position is a long or short on a real asset, opened on Hyperliquid&#x27;s markets." data-ko="Hyperliquid입니다. 모든 포지션은 Hyperliquid 마켓에서 열리는 실제 자산의 롱 또는 숏입니다."></span></div><div class="kv"><span class="k" data-en="What to bring" data-ko="준비물"></span><span class="v" data-en="$12 to $15 in USDC. The minimum trade is $10 and fees need a little headroom." data-ko="USDC $12~$15. 최소 거래 금액이 $10이고, 수수료 여유분이 조금 필요합니다."></span></div><div class="kv"><span class="k" data-en="Language" data-ko="언어"></span><span class="v" data-en="Profile, then Settings, then Language. Korean is available, including translation of narratives written in other languages." data-ko="Profile → Settings → Language에서 한국어를 선택할 수 있고, 다른 언어로 작성된 내러티브도 번역해 보여줍니다."></span></div><div class="kv"><span class="k" data-en="Rules" data-ko="규칙"></span><span class="v" data-en="Binding ones in section 12: never call it a prediction market, no referral codes, no P&amp;amp;L screenshots." data-ko="12번 섹션의 필수 규칙: 예측시장이라고 부르지 않기, 레퍼럴 코드 금지, 손익(P&amp;amp;L) 스크린샷 금지."></span></div></section><section class="panel" id="g1"><h2 data-en="01 &amp;nbsp;Your first ten minutes" data-ko="01 &amp;nbsp;처음 10분"></h2><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; Install &lt;b&gt;Sway: Narrative Markets&lt;/b&gt; from the App Store or Google Play." data-ko="&lt;b&gt;1.&lt;/b&gt; App Store 또는 Google Play에서 &lt;b&gt;Sway: Narrative Markets&lt;/b&gt;를 설치합니다."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Swipe through the eight introduction slides. The last one is a disclaimer: tap &lt;b&gt;Get Started&lt;/b&gt;." data-ko="&lt;b&gt;2.&lt;/b&gt; 소개 슬라이드 8장을 넘깁니다. 마지막 장은 면책 고지이며, &lt;b&gt;Get Started&lt;/b&gt;를 누르면 됩니다."></li><li data-en="&lt;b&gt;3.&lt;/b&gt; Tap &lt;b&gt;Create an Account&lt;/b&gt;. The EN button at the top right switches the language." data-ko="&lt;b&gt;3.&lt;/b&gt; &lt;b&gt;Create an Account&lt;/b&gt;를 누릅니다. 오른쪽 위 EN 버튼으로 언어를 바꿀 수 있습니다."></li></ul><div class="fig"><div class="row r3"><div class="shot"><button type="button" onclick="zoom(this)" aria-label="Enlarge screenshot"><img alt="" loading="lazy" width="540" height="1167" src="data:image/webp;base64,UklGRlg/AABXRUJQVlA4IEw/AADwjwGdASocAo8EPqVSo04mJKOpIlLI0SAUiWdu+BU8jqr8ts8Nb5th/P506vTVeJV2hA4PdinwGpiLtRph8Cn7F8/76jpI52wEvmP9T54fR75h3P881vmsf932I/3L1AP6f1UPpAebj60uQy+jf+H6oPL79z3Gfr/9X+ZPsK6B+znVH+afiL+R/j/ah/e/9XxN4BH5V/Qv+Dv/txvQO95vs/f6azfhb/u+4B/Pv3X5B78j/1fYL/n3+i9W//W8sf6N/wfYO/YcOHltyhd0NOiiWl/6w0dScgrqw0dSbtFKDgGJtbnaQv6cB6peaR8hYebTdg67gfZ3NJc0EpFG2ETyhgdNddwHqlpvduoI5dx8Yx/chsqjGmxBk6fASMdg6TEFpogVqv332OPRcNUJK66BFscyEPqWlK8FPzPAnJ9k/ELWmEiM3K5DrAMA9Hhf+sOythbsrzETP9tfDFJ3CTNeBz/icNbeaTT2vdREoXzumbqie0IMDwFb7sTwHWscD/YdYiYE3pKDJpmwzbVCm3Q2IitqG4D1aXOMUw0z1PrdWDKYs/mlc1hYof2TfopxrN/wSmWmKtUHlC9HhuA9XzAaeXLa1tOyro1GmW3PLxm1Tul7nHqv8ZY6ZH8BB7vOOPoWiy+Gk2nFZD/tF+bcBW/iwo1RI9S66/O+0KRd65w8mtRZ2NrgGhBsiHNEwF7QEp0XcFYC02f+Ac3Hu6hhji5fkCCCRIu9XD4sh3ZKHYrwO7eFb26IHGLB9F+gHW8ErcQ41XvempwhR5opmvgPaimyhIS/tGXDtH2AlKbrObB4DeLFItlPXJfStXqDiX+/sLFUM5CwYaxc6BA+BC2in60YqGs9ldUkEAGeTsO94pI5hI+eOr7GtjbioakHYFYQ5Rb7j9/vI/waxThvohM5EM2IC3T4bSXNkbsFepLzyFLd2rUrK8JVL7W4b+OW/7/tvYJycw0LvbewQ3FuaK1Dy6PDJuZRa/7vsByyBA3lBKphL9O6Eff/hBEM5fg/cUlOJIMlZn9ItoRPXM7I+zOtClTW1INIvKGbF58B2cVIX16MwA+nOjeZBzwZl+tkGyHBy1qXTwRWrGYka43dnYNw1MJpvhxPvede+W2GP1noQbECv9pOtgl0UFMYdr/6AEOcgKjKsoZDlhN9ehAFS9LNqgzLLmmE5DcMLOr4UBSfNZeYqGBcb6uSPpihJslplAYhFe52qsbqLre9av9FH7HAEyr841d80A </p></div></section><section class="panel" id="g2"><h2 data-en="02 &amp;nbsp;How a narrative works" data-ko="02 &amp;nbsp;내러티브는 이렇게 작동합니다"></h2><p class="body2" data-en="A narrative is a news story or market idea packaged as a trade. Each one carries a &lt;b&gt;title&lt;/b&gt;, an &lt;b&gt;asset&lt;/b&gt;, a &lt;b&gt;sentiment&lt;/b&gt; (bullish or bearish) and the &lt;b&gt;reasoning&lt;/b&gt; behind it." data-ko="내러티브는 뉴스나 시장 아이디어를 하나의 거래로 묶은 것입니다. 각 내러티브에는 &lt;b&gt;제목&lt;/b&gt;, &lt;b&gt;자산&lt;/b&gt;, &lt;b&gt;방향&lt;/b&gt;(Bullish 또는 Bearish), 그리고 그 &lt;b&gt;근거&lt;/b&gt;가 담겨 있습니다."></p><div class="sides"><div class="side bull"><span class="tag">Sway Bullish</span><span class="t" data-en="Opens a long" data-ko="롱 포지션을 엽니다"></span><span class="d" data-en="You profit if the asset price rises." data-ko="자산 가격이 오르면 수익이 납니다."></span></div><div class="side bear"><span class="tag">Sway Bearish</span><span class="t" data-en="Opens a short" data-ko="숏 포지션을 엽니다"></span><span class="d" data-en="You profit if the asset price falls." data-ko="자산 가격이 내리면 수익이 납니다."></span></div></div><p class="body2" data-en="The label describes the asset&#x27;s direction, not whether you agree. Agreeing with a bearish narrative on BTC means shorting BTC. Disagreeing with it means going long instead." data-ko="라벨은 동의 여부가 아니라 자산의 방향을 뜻합니다. BTC에 대한 Bearish 내러티브에 동의한다면 BTC 숏, 동의하지 않는다면 반대로 롱을 잡으면 됩니다."></p><p class="pull" data-en="Positions are trades on price, not bets on an outcome. Keep that distinction in everything you say about the&amp;nbsp;product." data-ko="포지션은 결과에 거는 베팅이 아니라 가격에 대한 거래입니다. 제품을 이야기할 때 이 구분을 늘 지켜 주세요."></p></section><section class="panel" id="g3"><h2 data-en="03 &amp;nbsp;Fund the account" data-ko="03 &amp;nbsp;계정에 입금하기"></h2><p class="body2" data-en="Trades settle on Hyperliquid, so funds have to reach your Hyperliquid trading balance. USDC sitting in a wallet on Arbitrum or HyperEVM does not count until it is deposited." data-ko="거래는 Hyperliquid에서 정산되므로, 자금이 Hyperliquid 거래 잔고까지 들어가야 합니다. Arbitrum이나 HyperEVM 지갑에 있는 USDC는 입금하기 전까지 잔고로 잡히지 않습니다."></p><div class="kv"><span class="k" data-en="Route A" data-ko="경로 A"></span><span class="v" data-en="USDC sent straight to your Sway Privy wallet. Best with no external wallet." data-ko="Sway Privy 지갑으로 USDC를 바로 보내는 방법. 외부 지갑이 없을 때 가장 편합니다."></span></div><div class="kv"><span class="k" data-en="Route B" data-ko="경로 B"></span><span class="v" data-en="USDC on Arbitrum, or an exchange that supports Arbitrum withdrawals. Best for most users." data-ko="Arbitrum의 USDC, 또는 Arbitrum 출금을 지원하는 거래소에서 보내는 방법. 대부분 이 경로가 맞습니다."></span></div><div class="kv"><span class="k" data-en="Route C" data-ko="경로 C"></span><span class="v" data-en="USDC on HyperEVM. Best when funds are already in the Hyperliquid ecosystem." data-ko="HyperEVM의 USDC. 이미 Hyperliquid 생태계에 자금이 있을 때 적합합니다."></span></div><div class="lcap sub" data-en="Route A: fund the Sway wallet" data-ko="경로 A: Sway 지갑에 입금"></div><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; Open the &lt;b&gt;Fund Wallet&lt;/b&gt; screen and copy your wallet address." data-ko="&lt;b&gt;1.&lt;/b&gt; &lt;b&gt;Fund Wallet&lt;/b&gt; 화면을 열고 지갑 주소를 복사합니다."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Send USDC to that address on the network the app specifies. Send a small test amount first and confirm it arrives." data-ko="&lt;b&gt;2.&lt;/b&gt; 앱에 표시된 네트워크로 해당 주소에 USDC를 보냅니다. 먼저 소액을 테스트로 보내 도착을 확인하세요."></li><li data-en="&lt;b&gt;3.&lt;/b&gt; Tap &lt;b&gt;Deposit USDC to Get Started&lt;/b&gt; to move it into your Hyperliquid balance, the one the app labels &quot;This is what you use to interact on Sway&quot;." data-ko="&lt;b&gt;3.&lt;/b&gt; &lt;b&gt;Deposit USDC to Get Started&lt;/b&gt;를 눌러 Hyperliquid 잔고로 옮깁니다. 앱에서 &quot;This is what you use to interact on Sway&quot;라고 표시된 잔고입니다."></li></ul><div class="fig"><div class="row r1"><div class="shot"><button type="button" onclick="zoom(this)" aria-label="Enlarge screenshot"><img alt="" loading="lazy" width="540" height="1167" src="data:im data-en="Route B: deposit from Arbitrum" data-ko="경로 B: Arbitrum에서 입금"></div><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; Withdraw USDC from your exchange to your wallet address on the &lt;b&gt;Arbitrum&lt;/b&gt; network. Skip this if it is already on Arbitrum." data-ko="&lt;b&gt;1.&lt;/b&gt; 거래소에서 &lt;b&gt;Arbitrum&lt;/b&gt; 네트워크로 내 지갑 주소에 USDC를 출금합니다. 이미 Arbitrum에 있다면 건너뛰세요."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Go to app.hyperliquid.xyz and connect the same wallet." data-ko="&lt;b&gt;2.&lt;/b&gt; app.hyperliquid.xyz에 접속해 같은 지갑을 연결합니다."></li><li data-en="&lt;b&gt;3.&lt;/b&gt; Click &lt;b&gt;Deposit&lt;/b&gt;. Set Asset to &lt;b&gt;USDC&lt;/b&gt; and Deposit Chain to &lt;b&gt;Arbitrum&lt;/b&gt;." data-ko="&lt;b&gt;3.&lt;/b&gt; &lt;b&gt;Deposit&lt;/b&gt;을 누르고 Asset은 &lt;b&gt;USDC&lt;/b&gt;, Deposit Chain은 &lt;b&gt;Arbitrum&lt;/b&gt;으로 설정합니다."></li><li data-en="&lt;b&gt;4.&lt;/b&gt; If MetaMask shows a &quot;Fund Hyperliquid with MetaMask&quot; prompt, choose &lt;b&gt;No thanks, deposit manually&lt;/b&gt;." data-ko="&lt;b&gt;4.&lt;/b&gt; MetaMask에 &quot;Fund Hyperliquid with MetaMask&quot; 창이 뜨면 &lt;b&gt;No thanks, deposit manually&lt;/b&gt;를 선택합니다."></li><li data-en="&lt;b&gt;5.&lt;/b&gt; Enter the amount and confirm in your wallet." data-ko="&lt;b&gt;5.&lt;/b&gt; 금액을 입력하고 지갑에서 승인합니다."></li></ul><p class="figcap" data-en="The Arbitrum deposit minimum is 5 USDC; anything below that is lost. A 0.2 USDC fee is taken from each deposit." data-ko="Arbitrum 최소 입금액은 5 USDC이며, 그보다 적게 보내면 자금을 잃습니다. 입금마다 0.2 USDC의 수수료가 차감됩니다."></p><div class="lcap sub" data-en="Route C: deposit from HyperEVM" data-ko="경로 C: HyperEVM에서 입금"></div><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; Go to app.hyperliquid.xyz and connect the wallet holding the USDC." data-ko="&lt;b&gt;1.&lt;/b&gt; app.hyperliquid.xyz에 접속해 USDC가 있는 지갑을 연결합니다."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Click &lt;b&gt;Deposit&lt;/b&gt;. Set Asset to &lt;b&gt;USDC&lt;/b&gt; and Deposit Chain to &lt;b&gt;HyperEVM&lt;/b&gt;." data-ko="&lt;b&gt;2.&lt;/b&gt; &lt;b&gt;Deposit&lt;/b&gt;을 누르고 Asset은 &lt;b&gt;USDC&lt;/b&gt;, Deposit Chain은 &lt;b&gt;HyperEVM&lt;/b&gt;으로 설정합니다."></li><li data-en="&lt;b&gt;3.&lt;/b&gt; Choose &lt;b&gt;No thanks, deposit manually&lt;/b&gt; if the MetaMask prompt appears." data-ko="&lt;b&gt;3.&lt;/b&gt; MetaMask 창이 뜨면 &lt;b&gt;No thanks, deposit manually&lt;/b&gt;를 선택합니다."></li><li data-en="&lt;b&gt;4.&lt;/b&gt; Enter the amount and confirm. HYPE covers the gas, so keep about 0.05 HYPE on HyperEVM." data-ko="&lt;b&gt;4.&lt;/b&gt; 금액을 입력하고 승인합니다. 가스비는 HYPE로 내므로 HyperEVM에 HYPE를 0.05개 정도 남겨 두세요."></li></ul></section><section class="panel" id="g4"><h2 data-en="04 &amp;nbsp;Using your own wallet instead" data-ko="04 &amp;nbsp;기존 지갑으로 시작하기"></h2><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; On a desktop browser, go to sway.fun/connect and connect your wallet, for example MetaMask." data-ko="&lt;b&gt;1.&lt;/b&gt; 데스크톱 브라우저에서 sway.fun/connect에 접속해 MetaMask 같은 지갑을 연결합니다."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Sign &lt;b&gt;Approve Sway (1/2)&lt;/b&gt;, the builder fee approval. It lets Sway charge its trading fee, capped at 0.1%." data-ko="&lt;b&gt;2.&lt;/b&gt; &lt;b&gt;Approve Sway (1/2)&lt;/b&gt;에 서명합니다. 빌더 수수료 승인으로, Sway가 최대 0.1% 한도 안에서 거래 수수료를 받을 수 있게 합니다."></li><li data-en="&lt;b&gt;3.&lt;/b&gt; Sign &lt;b&gt;Approve API Wallet (2/2)&lt;/b&gt;, the trading key, straight away. A prompt left open can expire." data-ko="&lt;b&gt;3.&lt;/b&gt; 거래 키인 &lt;b&gt;Approve API Wallet (2/2)&lt;/b&gt;에 바로 서명합니다. 창을 열어 둔 채 두면 만료될 수 있습니다."></li><li data-en="&lt;b&gt;4.&lt;/b&gt; Scan the QR code on the website with the Sway app to bring the wallet onto your phone. Treat that QR code like a password: never share it or a screenshot of it." data-ko="&lt;b&gt;4.&lt;/b&gt; 웹사이트의 QR 코드를 Sway 앱으로 스캔해 휴대폰으로 지갑을 가져옵니다. 이 QR 코드는 비밀번호처럼 다뤄 주세요. 코드나 그 스크린샷을 절대 공유하지 마세요."></li></ul><p class="figcap" data-en="Both approvals are one-time, are stored on Hyperliquid, and carry over to the mobile app." data-ko="두 승인은 한 번만 하면 되고, Hyperliquid에 저장되어 모바일 앱에도 그대로 적용됩니다."></p><div class="fig"><div class="shot wide"><button type="button" onclick="zoom(this)" aria-label="Enlarge screenshot"><img alt="" loading="lazy" width="900" height="467" src="data:image/webp;base64,UklGRi42AABXRUJQVlA4ICI2AABwEAGdASqEA9MBPqVSoE6mJCovoRK5afAUiWlu+ds//xa+/3/nfXZH9F//mXe+Vf/+FHro94ZF3//5zf8zGTdGZwsyBb/Am2siz7Tfrjsf8t38lhP9ft0/776FP5J/Tupz/T+Zb/n9Cf/70V8RP/btH+Xn3dB5NvNr+Nzj7a/pA5u3pm80Hmo+kz/GdNl67fRfet7/ssmI9L+bTyUxs1ZeF/03wR7DvcH+Rf8XoHe1fPFj9OCPZv7t4uX4H/V9le3L9aP7X5Hvk3sCfnX1Tv93yhfX/sDfr4Hm5zqYz25FPQPRgYytZGUfHMxEnRa8RJ0WvESdFpyeffC4JT+0NGAi+7K6OL45ZBNS73Fq3gwbLWCKxUwpmZWPhJ2oSbHrMbDADCSuvkXkXjx7ruvwMGGBaQSwQMWaXVK5/kzm+HzX8VWj/j8NTXQg6DsZNV2Z6swrItRcXIZp86DdFt/IeYL0NA1nPomFWgToGY03o87/wYjqG3ffiWkKutuxJeDOmIT1u1/MOoVDRjoleAXjPyE0qUPd2oWWL68oCdRMUAc1AL3QKX+eG1fWVV1YWwAAJ40U28K3xt83cu6cjTZzMRJ0WvESdF+iwFvYUHlkcY2fJtx3I40Z7N84E7hKI7hgyj8sY56QYQ6edNrAnRBEYlRxf3rqYspFf2tEFfP0wY1HBdJ/Bc7qxQqVeBsXk371H8n8OCGB4o6r4r6BEKi/kvXd2vx6HQG5WEa74jU7uh40FjpKtqLs0Nv6iLqtGrqj1eShxDOEHttVLCaAxWkvLPXCRJk025ldoKdPcLfEamx84iJOi14iS6KagPQisgki2BMYg6kMV/NyIQLn4qqDjWELh+vIMCWmKt13Ihz8RpHFPvMYUzMdhkYuWNg5vFysDz7/TH3z1VkGpmO5x3Pyh9CeRQhYEXeHk2N0+pwf39QL5yfxl9qLoM8O7kfKBMzHYJZ95k6JjrB+KCjFupm+G5LSW5Wtpr9B5UUvzWIpxAnvYZo1ugFJ4mSBgeFSZImeBx2nwLApghBPzq+GjB08JWz91zxK5e9DcbhRP54RMQagfWEVMkCtXAxDttH32a2Da/xH0O6NJvtMQm90u0JLRiXVkgkQftyWsZiGjWAJkMDRAnzL/lvRr9BtD+9AGD2Zu/HUFTHHJhzAcxvBQQJySF3X66w0KK9QvBK50KGMQNEUf95Jr6UcXnhofJIrt2wux1XxSzKxlzg5rVTbZdYPOo9JucdzjOWXUrazJ1/D9CAr1ZJiUUWX0G1VPz3EQastSV93RdYhJpHHhEQW9HeOuRPwk39wSL0zU81UuuebZ7ZvawMOmqNUsUCnVd7RKEJTA0EHPGaElEjp62U4mzqhu8sIxP5AYDvXclOVu+t44QzO888gDaTYHJY5aLQiXfUvTLeoUXlNtpc9L7a4Vlw+tvnlz4aMQiR+iO0H+6rcbbD0IAV0ygsuJz8bjOyMEUEe/+/MwfykyKHgPXcmgx7DEwz5gaF743tL9GBPe7d3XNX2xvq4WVgCUhk7u5iZ6rCKtJtgxth7ZeN3jFLccjozmdDRv6Gq0jWVgMY4TWOszh7ha60BGuhcsne6kgRI4j9ISAhe25Se6PWAJjbD2vz4809F6Cq78vVfCKnES1BF/Q8h49Wiue/uc/KoT4WY8OwiljKqsKPhfLNZNpL9+ZmO5xpRQluhq /li><li data-en="&lt;b&gt;5.&lt;/b&gt; Optional: tap &lt;b&gt;TP/SL&lt;/b&gt; to add a take profit and a stop loss." data-ko="&lt;b&gt;5.&lt;/b&gt; 선택 사항으로 &lt;b&gt;TP/SL&lt;/b&gt;을 눌러 익절가와 손절가를 걸 수 있습니다."></li><li data-en="&lt;b&gt;6.&lt;/b&gt; Check the summary (funding, estimated fee, collateral, notional value, liquidation price), then tap the trade button." data-ko="&lt;b&gt;6.&lt;/b&gt; 요약(펀딩비, 예상 수수료, 증거금, 명목 가치, 청산가)을 확인한 뒤 거래 버튼을 누릅니다."></li></ul><div class="fig"><div class="row r3"><div class="shot"><button type="button" onclick="zoom(this)" aria-label="Enlarge screenshot"><img alt="" loading="lazy" width="540" height="1167" src="data:image/webp;base64,UklGRv59AABXRUJQVlA4IPJ9AADQDgKdASocAo8EPqVOok2mJCOmJBQJsMAUiWdu9IX+BP3u2cpv+s+YF+kdpdjaQD/h96f/F+33pIfXOm0yc/83oJ/5nn1/9fLn/O40Xo/sj4dOeuWftyYcpKm+PWVpUUoxn6v+hf3O693ffC9JfExy15UnUvnx/7PrD/w3o+dGzzb+Z5/4PXd/S/SA9Lr1vfS86bH+25MD6B/0X929gXix+m/vni7+R/Rv7X/B/5/2+PrXHX6X/U+Y/83/CH9H/E+g37U+KP5r/H/sx7Av51/V/OJ+g7Hja/9f6Avup+H8fn4P/4f6X1Q/Qv8t/7PcE/n/9z/6f+I9vv+X4Pv5b/oewJ+nv/N/jvzH+mL/I+sz3hfrX++/+vuK/sd14/SsHheZ8WnCWdJIs34SyergUz1Q510sBRNMlkH5otjuEmPf7uhRlGPHPfU1cUaLThLOkkWb8Jz7u1pzrnxQq62LekYLNeBSSw1uCevixF9r2IWKEOoufVtnZJcCA1A6A5kUdomAfSIhmJYP8dl8avrEde+QWYPzRTABaPcKjp34t7rTfdrC09wObV15q+43+Kb3g8XOnlYjf3CDcXKfBryETksS62dTnsGxdaIey2o24Sv2VnXA4aJItliJupnGGnOkVtC475ON7CsVGmCP9FO4PYSgnJOW/M3VN1OLgOz0srWGwlhCH/msqOwY8z+v2qSstHTrYHGSCOIsPAMaeUdabcCjRacJZ0jzN72TzKRSP0YpknuIzhWBLU0xwQ/kpHuWeYNjQLVaAU61gKWM6ekt7GuzuQLfJGz/wtk9hoVptaJdgpiAPfNUC//1LYIsa03rZeatLg9YZgaPqtG9XZxprXZYX006UTUuQvTGPKJkUUMAW6ghFp62KbhKFB0yP9TUctTQ3gUzbwjEY9Tm6qx3MpINWxzivgmMzXjOH42nqdhfwCqysxZbo7hnnb+Azv2zV5da4isPowrp7g3x82iGi0afskK4FI5tkOQvHnWvgYD8NYsOHnYGI8EIG56xaN5tOYwW6VWas/nUlTkaEFCKLmPKM7yLIuMKhyig16pSntGIwrROx/4yaPqCQVllKxIYQAK4yUap4cvZXzOtytDLjbRMyD6Wi646WvTkeUIVl1U4s0cvpjBsQna2Gd+xMqugOUZ39kSnqTsuHW5xZI5P7ytnL1Z5BszUSoNo9ogQjTwB8RXDWLZnPt6+3iUGZmfz64b/bD7FgvW4Zkke6o6lVPXilV0ZPqj/F8s8U/YfYK7caCY5zpJFl/ZUmDfREXlL9mavTu+fByK0+SeIY03YW6772 t;3.&lt;/b&gt; &lt;b&gt;Cash Out&lt;/b&gt; 창에서 &lt;b&gt;Market&lt;/b&gt; 또는 &lt;b&gt;Limit&lt;/b&gt;과 정리할 비율을 고릅니다. 100%면 전부 정리됩니다."></li><li data-en="&lt;b&gt;4.&lt;/b&gt; Review the estimated cash released, fee and profit or loss, then &lt;b&gt;swipe to cash out&lt;/b&gt;." data-ko="&lt;b&gt;4.&lt;/b&gt; 예상 수령액, 수수료, 손익을 확인하고 &lt;b&gt;swipe to cash out&lt;/b&gt;으로 밀어서 정리합니다."></li></ul><div class="fig"><div class="row r3"><div class="shot"><button type="button" onclick="zoom(this)" aria-label="Enlarge screenshot"><img alt="" loading="lazy" width="540" height="1167" src="data:image/webp;base64,UklGRiZeAABXRUJQVlA4IBpeAAAQ0QGdASocAo8EPqVQok2mJKMpI1PZaSAUiWdu+9jhf50wkmE+V//eWWmsRbaw58fzcrO/n/JT18xaO4jN1/yfVp+rvYL55vmX/dj1ZvS1/YfR06o/ejfK81YHzl/r/7/6//Gr9h/gvHnyX/APpD24/yfJv6l/X/th6mfzP8Ffx/8x6Jfs54m/KnUF/Ov6l/yvUG+07G3av99/7PUF9ofv//h8yv4L/sf5r1R/Rf8l/3P8l+UH2A/zL+t/8L7fvm3/p+Df+K/2X7dfAJ/OP7r/3f8z+V30xf5H/z8wH6V/vv/t7hX9B/wnXZ9JQY1WZUvXo+f5MM1++3fJhUwzX7AJZqp9UgMAk4JpVfr24CupMeXVlc02k9s1OKkHTsgUSkMFXDBkJMKj6nmfV8je4UEARzIfpcTMa/mh+/+tsgIuEL7Tq7oBmv2aBJuLOZFhw7GOyypYYNLGhQvFQEDxkLlmM0HKP9c+e4UIr/+mAPWZamENajKtVTkJ5R4+R6ZZAlGIfFx0R9llSvMHNpTqXq394LEi8xk6g/flNgLVSNk5+YinL9Tir9WfMdWPprluiBEoVMM1++3fJgZBD6fKfviCUe8ufc5a3P9qJK6/+jzIIwSYVMM1++3fJhUwzX77d8mFTDNfvt3yYVMM1++3fJhUwy75OBpNi3N/Dk2PVFvEg7maQvdcKlqMFg/7d8mFTDNfvt3yYVMMxQesE4KvA+T+y/vA/7L+8D/sv7wP+ci8eHMELCprAXKQf6I2qv77d8mFTDNfvt3yYVUzAPt04uMgANHLPBY6wyL0XfjwfkxPYYytHw5dIpGFHsJNCt+cjJISgemPxFQsHfEafeYKXeRKu6xUDXAhWf0DrWilkgcMt+t16+lJhCmfnFSDyPPgg5wtXvcj6uOoRQ9mqZrfReXSBwo1ZmLLTgGHMrEWApxn+lCznBZQ4E5EhxYb01QC6c8IckS/5hUwzX75NACBvGItD57/uiqIVmohLxadS9RGJVaRkDJQK8LL6cP1DNfMYG6jwFX4u8olDWPun7K+o3kiGiRDd8mFTCzCGCn1YExLzxkmVHL1jo9py3bH9p2igWsK/eB/2X94HxJQgeTpPR06Ewgv2X94H/Zf3gf9l/eB/2X93XzYq6yN1XLjUB13Fyu+OWqj7lz5PKO9oldqckJEDypB5JQqYZr7KD/0DzwAD+4IKGAa2wQQOBy5FlOAOvGhUXquqz0j+VBtZdHb+DhwLF9DOBa4INwHfVU90h16vfbvkwqYZr6mAA6YOoT7KL6sJQQSBdxW8TPy1XQkRgP69p3khfGdMya9oZLqSZOLnbWlmS5s4GB2Hoiw3bj5CME8f4c4V5RnyOW2BbSrngcQE/rG3P /h3><p data-en="Cite the data or the event behind it." data-ko="그 뒤의 데이터나 이벤트를 밝혀 주세요."></p></div></div><p class="body2" data-en="Trades on a narrative you create pay Sway&#x27;s full builder fee, and 80% of that fee goes to you. Earnings update daily and become claimable above $1, once your own account has reached $10,000 in trading volume. Sway&#x27;s Terms treat these rewards as discretionary and changeable. Creating narratives is part of what we want your read on; promoting the earnings publicly is not, for the reason in section 12." data-ko="내가 만든 내러티브에서 거래가 일어나면 Sway의 빌더 수수료가 할인 없이 붙고, 그중 80%가 나에게 돌아옵니다. 수익은 매일 업데이트되며, 내 계정 거래량이 $10,000에 도달한 뒤 $1 이상부터 청구할 수 있습니다. Sway 약관상 이 리워드는 재량에 따라 바뀔 수 있습니다. 내러티브를 만들어 보고 의견을 주시는 건 환영이지만, 12번 섹션의 이유로 이 수익을 공개적으로 홍보하지는 말아 주세요."></p></section><section class="panel" id="g8"><h2 data-en="08 &amp;nbsp;Fees" data-ko="08 &amp;nbsp;수수료"></h2><div class="kv"><span class="k" data-en="Market order" data-ko="시장가 주문"></span><span class="v" data-en="0.045%, Sway narrative, Explorer tier. Charged to open and to close." data-ko="0.045%, Sway 내러티브, Explorer 티어 기준. 포지션을 열 때와 닫을 때 각각 붙습니다."></span></div><div class="kv"><span class="k" data-en="Limit order" data-ko="지정가 주문"></span><span class="v" data-en="0.0135%, Sway narrative, Explorer tier. Charged to open and to close." data-ko="0.0135%, Sway 내러티브, Explorer 티어 기준. 포지션을 열 때와 닫을 때 각각 붙습니다."></span></div><div class="kv"><span class="k" data-en="User-created" data-ko="유저 내러티브"></span><span class="v" data-en="Sway&#x27;s full builder fee, no tier discount: 0.05% on a market order." data-ko="티어 할인 없이 Sway 빌더 수수료 전액: 시장가 주문 0.05%."></span></div><div class="kv"><span class="k" data-en="Funding" data-ko="펀딩비"></span><span class="v" data-en="Varies, paid or received hourly while a position is open." data-ko="포지션이 열려 있는 동안 매시간 변동 금액을 내거나 받습니다."></span></div><div class="kv"><span class="k" data-en="Deposit" data-ko="입금"></span><span class="v" data-en="From Arbitrum: 0.2 USDC per deposit, 5 USDC minimum." data-ko="Arbitrum에서 입금 시 건당 0.2 USDC, 최소 5 USDC."></span></div><div class="kv"><span class="k" data-en="Withdraw" data-ko="출금"></span><span class="v" data-en="To Arbitrum: $1.00 flat, $2 minimum." data-ko="Arbitrum으로 출금 시 $1.00 고정, 최소 $2."></span></div><div class="kv"><span class="k" data-en="To HyperEVM" data-ko="HyperEVM 이체"></span><span class="v" data-en="One-time $1 activation fee on the first transfer out, plus HYPE gas." data-ko="첫 이체 때 1회 $1 활성화 수수료와 HYPE 가스비가 듭니다."></span></div><p class="figcap" data-en="Every account starts on the Explorer tier, and the discount grows with lifetime volume. The estimated fee and net payout always show in-app before you confirm. Rates are live and can change; check sway.fun/docs before quoting one." data-ko="모든 계정은 Explorer 티어에서 시작하고, 누적 거래량에 따라 할인이 커집니다. 예상 수수료와 수령액은 확정 전에 항상 앱에 표시됩니다. 수수료율은 바뀔 수 있으니 인용 전에 sway.fun/docs를 확인해 주세요."></p></section><section class="panel" id="g9"><h2 data-en="09 &amp;nbsp;Withdraw" data-ko="09 &amp;nbsp;출금하기"></h2><ul class="pts"><li data-en="&lt;b&gt;1.&lt;/b&gt; Go to Profile, Settings, &lt;b&gt;Deposits &amp;amp; Withdrawals&lt;/b&gt;, or withdraw at app.hyperliquid.xyz." data-ko="&lt;b&gt;1.&lt;/b&gt; Profile → Settings → &lt;b&gt;Deposits &amp;amp; Withdrawals&lt;/b&gt;로 가거나, app.hyperliquid.xyz에서 출금합니다."></li><li data-en="&lt;b&gt;2.&lt;/b&gt; Withdrawing to Arbitrum costs $1 per withdrawal, with a $2 minimum. On a small balance, withdraw once at the end rather than in pieces; on $10, a single withdrawal costs about 10%." data-ko="&lt;b&gt;2.&lt;/b&gt; Arbitrum 출금은 건당 $1, 최소 $2입니다. 잔고가 적다면 나눠서 빼지 말고 마지막에 한 번만 출금하세요. $10 기준으로 한 번 출금에 약 10%가 듭니다."></li></ul></section><section class="panel" id="g10"><h2 data-en="10 &amp;nbsp;If something goes wrong" data-ko="10 &amp;nbsp;문제가 생겼을 때"></h2><ul class="pts"><li data-en="&lt;b&gt;&quot;Must deposit before performing actions&quot;.&lt;/b&gt; No funds in your Hyperliquid trading balance. Complete a funding route in section 03, then retry." data-ko="&lt;b&gt;&quot;Must deposit before performing actions&quot;.&lt;/b&gt; Hyperliquid 거래 잔고에 자금이 없는 상태입니다. 03번 섹션의 입금 경로를 마친 뒤 다시 시도하세요."></li><li data-en="&lt;b&gt;&quot;Agent valid_until already expired&quot;.&lt;/b&gt; The trading key approval expired before reaching Hyperliquid, usually from an out-of-sync device clock or a stale page. Sync your clock, refresh and sign straight away. If it persists, disconnect Sway in your wallet, reconnect and retry." data-ko="&lt;b&gt;&quot;Agent valid_until already expired&quot;.&lt;/b&gt; 거래 키 승인이 Hyperliquid에 닿기 전에 만료된 경우로, 보통 기기 시계가 안 맞거나 페이지가 오래된 탓입니다. 시계를 맞추고 새로고침한 뒤 바로 서명하세요. 계속되면 지갑에서 Sway 연결을 끊고 다시 연결해 시도하세요."></li><li data-en="&lt;b&gt;No close button on Home.&lt;/b&gt; Closing sits in Notifications: bell icon, tap the trade, Cash Out." data-ko="&lt;b&gt;Home에 닫기 버튼이 없음.&lt;/b&gt; 정리는 알림에서 합니다. 종 아이콘 → 거래 선택 → Cash Out."></li><li data-en="&lt;b&gt;Cash-out estimate differs from the final balance.&lt;/b&gt; Normal: funding and price movement at execution. Hyperliquid&#x27;s Trade History and Funding History show the exact breakdown." data-ko="&lt;b&gt;Cash out 예상액과 최종 잔고가 다름.&lt;/b&gt; 정상입니다. 펀딩비와 체결 시점의 가격 변동 때문이며, Hyperliquid의 Trade History와 Funding History에서 정확한 내역을 볼 수 있습니다."></li></ul><p class="body2" data-en="Anything not on this list, or anything that did not complete, send to your Holo Hive contact with a screenshot and the time it happened." data-ko="여기 없는 문제나 끝까지 진행되지 않은 건은 스크린샷과 발생 시각을 담아 Holo Hive 담당자에게 보내 주세요."></p></section><section class="panel" id="g11"><h2 data-en="11 &amp;nbsp;What good feedback looks like" data-ko="11 &amp;nbsp;좋은 피드백이란"></h2><div class="take"><h3 data-en="Name a step and a moment" data-ko="단계와 순간을 짚어 주세요"></h3><p data-en="Feedback that names a screen and a moment gets acted on. &quot;Funding took 25 minutes because my exchange had no Arbitrum withdrawal&quot; moves the product. &quot;The app is good&quot; does not. Your notes go to the Sway founders in English every week." data-ko="화면과 순간을 짚은 피드백은 실제로 반영됩니다. &quot;거래소에 Arbitrum 출금이 없어서 입금에 25분 걸렸다&quot;는 제품을 바꾸지만, &quot;앱 좋네요&quot;는 아무것도 바꾸지 못합니다. 주신 의견은 매주 영어로 정리되어 Sway 창업자들에게 전달됩니다."></p></div><ul class="pts"><li data-en="&lt;b&gt;Getting money in.&lt;/b&gt; Which route you used, starting from which Korean exchange, and how long each step took. This is where most new Korean users would stop, so it matters most." data-ko="&lt;b&gt;입금 과정.&lt;/b&gt; 어떤 경로를, 어느 한국 거래소에서 출발해 썼는지, 단계마다 얼마나 걸렸는지. 한국 신규 유저가 가장 많이 멈출 지점이라 가장 중요합니다."></li><li data-en="&lt;b&gt;Headline to position.&lt;/b&gt; How long from opening a narrative to having a position open, and whether it felt faster than the tools you use today." data-ko="&lt;b&gt;헤드라인에서 포지션까지.&lt;/b&gt; 내러티브를 연 순간부터 포지션이 열릴 때까지 얼마나 걸렸는지, 지금 쓰시는 툴보다 빠르게 느껴졌는지."></li><li data-en="&lt;b&gt;Whether it ever reads like a bet.&lt;/b&gt; If any narrative, label or screen felt like wagering on an outcome rather than trading an asset, tell us exactly where." data-ko="&lt;b&gt;베팅처럼 느껴지는 순간.&lt;/b&gt; 내러티브, 라벨, 화면 중 자산 거래가 아니라 결과에 거는 느낌을 준 곳이 있다면 정확히 어디였는지."></li><li data-en="&lt;b&gt;Closing.&lt;/b&gt; Whether you found the Cash out flow without this guide." data-ko="&lt;b&gt;정리 과정.&lt;/b&gt; 이 가이드 없이도 Cash out 흐름을 찾으셨는지."></li><li data-en="&lt;b&gt;The Korean translation.&lt;/b&gt; Where a translated narrative read unnaturally or lost its meaning." data-ko="&lt;b&gt;한국어 번역.&lt;/b&gt; 번역된 내러티브가 어색하거나 뜻이 흐려진 부분."></li><li data-en="&lt;b&gt;Creating a narrative.&lt;/b&gt; Whether the fields were enough to say what you meant, and whether anyone traded it." data-ko="&lt;b&gt;내러티브 작성.&lt;/b&gt; 입력 항목만으로 하고 싶은 말을 충분히 담을 수 있었는지, 누군가 그 내러티브로 거래했는지."></li><li data-en="&lt;b&gt;Fees as you felt them.&lt;/b&gt; Whether the cash-out screen matched what you expected to pay." data-ko="&lt;b&gt;체감 수수료.&lt;/b&gt; Cash out 화면의 금액이 예상과 맞았는지."></li><li data-en="&lt;b&gt;What would bring you back.&lt;/b&gt; What the app would need for you to open it daily, and what you would want first if you could add one thing." data-ko="&lt;b&gt;다시 열게 만드는 것.&lt;/b&gt; 매일 앱을 열게 하려면 무엇이 필요한지, 하나만 추가할 수 있다면 무엇을 원하시는지."></li><li data-en="&lt;b&gt;Where you stopped.&lt;/b&gt; If you chose not to fund or not to trade, tell us the specific reason. That is as useful as anything above." data-ko="&lt;b&gt;멈춘 지점.&lt;/b&gt; 입금이나 거래를 하지 않기로 하셨다면 구체적인 이유를 알려주세요. 위의 어떤 항목만큼이나 유용합니다."></li></ul></section><section class="panel" id="g12"><h2 data-en="12 &amp;nbsp;Where this program stops, and the rules" data-ko="12 &amp;nbsp;프로그램의 범위와 규칙"></h2><ul class="pts"><li data-en="&lt;b&gt;Trading is your own decision with your own capital.&lt;/b&gt; Nothing here is a recommendation to place a trade, and the pilot does not require you to fund anything." data-ko="&lt;b&gt;거래는 본인의 판단과 본인의 자금으로 합니다.&lt;/b&gt; 이 페이지의 어떤 내용도 거래 권유가 아니며, 파일럿 참여를 위해 입금할 필요는 없습니다."></li><li data-en="&lt;b&gt;Posting is optional.&lt;/b&gt; If you post, it is your own read, in your own voice, in Korean." data-ko="&lt;b&gt;게시는 선택입니다.&lt;/b&gt; 올리신다면 크리에이터님의 시각으로, 평소 말투 그대로, 한국어로 써 주세요."></li><li data-en="&lt;b&gt;Never call Sway a prediction market or frame it as betting.&lt;/b&gt; It is trading the asset behind a narrative. Korean regulators block prediction markets as gambling, so yes/no, win/lose or odds language is off limits." data-ko="&lt;b&gt;Sway를 예측시장이라 부르거나 베팅처럼 표현하지 마세요.&lt;/b&gt; Sway는 내러티브 뒤의 자산을 거래하는 앱입니다. 국내 규제상 예측시장은 도박으로 차단되므로 예/아니오, 승/패, 배당률 같은 표현은 쓰지 않습니다."></li><li data-en="&lt;b&gt;No referral codes or links, ever, in any post, channel or message.&lt;/b&gt; Korea&#x27;s FIU treats promoting an overseas platform for referral commission as unregistered brokerage, and the same caution applies to promoting narrative earnings." data-ko="&lt;b&gt;레퍼럴 코드나 링크는 어떤 게시물, 채널, 메시지에도 올리지 마세요.&lt;/b&gt; 금융정보분석원(FIU)은 해외 플랫폼을 레퍼럴 수수료 목적으로 홍보하는 행위를 미신고 중개로 보며, 내러티브 수익 홍보에도 같은 주의가 필요합니다."></li><li data-en="&lt;b&gt;Never post P&amp;amp;L or share cards.&lt;/b&gt; A screenshot of a profitable trade reads as a performance claim. Talk about the process as much as you like; keep results off the timeline." data-ko="&lt;b&gt;손익(P&amp;amp;L) 화면이나 공유 카드는 올리지 마세요.&lt;/b&gt; 수익 난 거래 캡처는 성과 주장으로 읽힙니다. 과정은 얼마든지 이야기하셔도 되지만, 결과는 타임라인에 올리지 말아 주세요."></li><li data-en="&lt;b&gt;No user, volume or growth figures about Sway.&lt;/b&gt; If a figure is not in the brief or on sway.fun/docs, leave it out." data-ko="&lt;b&gt;Sway의 사용자 수, 거래량, 성장 수치는 언급하지 마세요.&lt;/b&gt; 브리프나 sway.fun/docs에 없는 숫자는 빼 주세요."></li><li data-en="&lt;b&gt;Do not claim Korean-language service or support.&lt;/b&gt; Showing the app in Korean in your own content is fine; stating that Sway offers Korean-language service is not." data-ko="&lt;b&gt;한국어 서비스나 지원을 제공한다고 말하지 마세요.&lt;/b&gt; 콘텐츠에서 한국어 설정 화면을 보여주는 건 괜찮지만, Sway가 한국어 서비스를 제공한다고 언급하는 건 안 됩니다."></li><li data-en="&lt;b&gt;Famous accounts in the feed are not endorsements.&lt;/b&gt; Sway builds narratives from public posts by well-known traders. Never imply any of them use or back Sway." data-ko="&lt;b&gt;피드의 유명 계정은 보증이 아닙니다.&lt;/b&gt; Sway는 유명 트레이더의 공개 게시물로 내러티브를 만듭니다. 그들이 Sway를 쓰거나 지지한다고 암시하지 마세요."></li><li data-en="&lt;b&gt;No price targets, return promises or investment advice.&lt;/b&gt; Client review applies to anything touching a new feature, a launch, or anything forward-looking." data-ko="&lt;b&gt;목표가, 수익 약속, 투자 조언은 금지입니다.&lt;/b&gt; 신규 기능, 출시, 향후 계획과 관련된 콘텐츠는 클라이언트 검토를 거칩니다."></li></ul><p class="body2" data-en="Anything you run into comes to your Holo Hive contact first, not into a public channel." data-ko="문제가 생기면 공개 채널이 아니라 Holo Hive 담당자에게 먼저 알려주세요."></p></section></div>

<script>var LANG='en';
/* The language switch navigates to the other entry instead of swapping text in place,
   so the address bar always holds a shareable link in the language on screen. On a
   holohive.io host that is the subdomain pair; anywhere else (Vercel preview, local file)
   it falls back to the relative entry path. The hash rides along. */
var ALT_LANG='ko', ALT_REL='ko/index.html';
function altHref(){
  if(/(^|\.)holohive\.io$/i.test(location.hostname)){
    return (ALT_LANG==='ko'?'https://sway-kr.holohive.io/':'https://sway.holohive.io/')+location.hash;
  }
  return ALT_REL+location.hash;
}
function go(l){if(l===LANG){return}location.href=altHref()}
function setLang(l){
  LANG=l;
  document.querySelectorAll('[data-en]').forEach(function(e){var t=e.getAttribute('data-'+l);if(t!==null){e.innerHTML=t}});
  document.documentElement.lang=l;
  document.getElementById('b-en').className=(l==='en')?'on':'';
  document.getElementById('b-ko').className=(l==='ko')?'on':'';
}
/* The Product Guide is gated. Locked by default: the tab shows a
   padlock and opens the locked panel. Onboarded creators get a link ending
   #guide-onboarded, which opens the real guide. Front-end only, deliberately: the guide
   ships in this file. The unlocked hash is written back on every tab change, so it
   survives the language switch (altHref carries location.hash) and a refresh. */
var UNLOCK='onboarded', OPEN=(location.hash==='#guide-'+UNLOCK);
function setTab(t){
  var g=(t==='guide'&&OPEN), l=(t==='guide'&&!OPEN);
  document.getElementById('v-about').className='view'+(t==='about'?'':' hide');
  document.getElementById('v-guide').className='view'+(g?'':' hide');
  document.getElementById('v-locked').className='view'+(l?'':' hide');
  document.getElementById('t-about').className=(t==='about')?'on':'';
  document.getElementById('t-guide').className=(t==='guide'?'on':'')+(OPEN?'':' gated');
  if(history.replaceState){history.replaceState(null,'',t==='guide'?(OPEN?'#guide-'+UNLOCK:'#guide'):'#')}
  window.scrollTo(0,0);reveal();
}
function setSide(s){
  var v=document.getElementById('vs');
  v.classList.toggle('side-new',s==='new');v.classList.toggle('side-old',s==='old');
  document.getElementById('segNew').classList.toggle('on',s==='new');
  document.getElementById('segOld').classList.toggle('on',s==='old');
}
window.addEventListener('hashchange',function(){if(location.hash==='#guide-'+UNLOCK&&!OPEN){OPEN=true}if(location.hash.indexOf('#guide')===0){setTab('guide')}});
/* Screenshot lightbox: app UI is unreadable at 375px, so every shot opens full-screen at
   natural size. The caption is read live off the shot's label, so it follows the language. */
function zoom(b){
  var i=b.querySelector('img'),s=b.parentNode.querySelector('.scap');
  document.getElementById('boximg').src=i.src;
  document.getElementById('boxcap').innerHTML=s?s.innerHTML:'';
  document.getElementById('box').className='box on';
  document.getElementById('boxinner').scrollLeft=0;
  document.body.style.overflow='hidden';
}
function unzoom(e){if(e){e.stopPropagation()}document.getElementById('box').className='box';document.body.style.overflow=''}
document.getElementById('box').addEventListener('click',function(e){if(e.target.id==='box'){unzoom()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){unzoom()}});
function reveal(){document.querySelectorAll('.view:not(.hide) .panel').forEach(function(p){if(!p.classList.contains('reveal')){p.classList.add('reveal')}if(p.getBoundingClientRect().top<window.innerHeight-40){p.classList.add('in')}})}
function onScroll(){
  var y=window.scrollY||document.documentElement.scrollTop;
  var h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('bar').style.width=(h>0?(y/h*100):0)+'%';
  document.getElementById('top').className=y>4?'top stuck':'top';
  document.getElementById('tobtn').className=y>700?'top-btn show':'top-btn';
  reveal();
}
window.addEventListener('scroll',onScroll,{passive:true});
/* Chip jump, offset for the sticky header. Screenshots carry width/height, so the guide
   does not reflow under the jump the way an unsized image page would. */
document.querySelectorAll('.chips a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.querySelector(a.getAttribute('href'));if(t){window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-108,behavior:'smooth'})}})});
setLang(LANG);
setTab(location.hash.indexOf('#guide')===0?'guide':'about');
onScroll();

/* Desktop layer: marks the guide section in view in the sidebar contents (>=900px only). */
(function(){
  var mq=window.matchMedia('(min-width:900px)');
  var chips=[].slice.call(document.querySelectorAll('#v-guide > .chips a'));
  if(!chips.length||!('IntersectionObserver' in window))return;
  var map={},ratio={};
  chips.forEach(function(a){var id=(a.getAttribute('href')||'').slice(1);if(id&&document.getElementById(id))map[id]=a});
  function paint(){var best=null,bv=0;for(var k in ratio){if(ratio[k]>bv){bv=ratio[k];best=k}}chips.forEach(function(a){a.classList.remove('cur')});if(best&&map[best])map[best].classList.add('cur')}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){ratio[e.target.id]=e.isIntersecting?e.intersectionRatio:0});paint()},{rootMargin:'-120px 0px -55% 0px',threshold:[0,0.2,0.5,1]});
  function start(){for(var id in map){io.observe(document.getElementById(id))}}
  function stop(){io.disconnect();ratio={};chips.forEach(function(a){a.classList.remove('cur')})}
  if(mq.matches)start();
  var onchange=function(e){e.matches?start():stop()};
  if(mq.addEventListener)mq.addEventListener('change',onchange);else if(mq.addListener)mq.addListener(onchange);
})();
</script>
